# Production overlay. Caddy is the only service with public ports.
#
#   Docker hosts everything:
#     docker compose --env-file .env.production -f compose.yaml -f compose.prod.yaml up -d
#   Vercel hosts the frontend (CADDYFILE=Caddyfile.api in .env.production):
#     docker compose --env-file .env.production -f compose.yaml -f compose.prod.yaml up -d caddy
services:
  postgres:
    restart: unless-stopped

  seed:
    profiles: [dev]

  postgrest:
    restart: unless-stopped
    ports: !reset []
    environment:
      PGRST_LOG_LEVEL: warn

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?set API_URL in .env.production}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env.production}
      APP_HOST: ${APP_HOST:-}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgrest

volumes:
  caddy_data:
  caddy_config:
