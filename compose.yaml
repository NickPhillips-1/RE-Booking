# Local development: cp .env.example .env && docker compose up
# Production adds compose.prod.yaml; see README.md.
name: re-booking

x-postgres-client: &postgres-client
  image: postgres:16.15-alpine
  environment: &postgres-client-env
    PGHOST: postgres
    PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  volumes:
    - ./db:/db:ro
    - ./deploy/migrate.sh:/deploy/migrate.sh:ro

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: the temporary server the image runs during first-time init
      # only listens on the Unix socket.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *postgres-client
    command: ["sh", "/deploy/migrate.sh"]
    environment:
      <<: *postgres-client-env
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set AUTHENTICATOR_PASSWORD in .env}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *postgres-client
    environment:
      <<: *postgres-client-env
      # Checked when the seed runs. Compose interpolates every service, so a required
      # variable here would also be required in production, where the seed is off.
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        : "$${SEED_AGENT_PASSWORD:?set SEED_AGENT_PASSWORD in .env}";
        : "$${SEED_CLIENT_PASSWORD:?set SEED_CLIENT_PASSWORD in .env}";
        psql -X -q -v ON_ERROR_STOP=1
        -v slug=jane -v email=jane@example.com -v name='Jane Rivera'
        -v brand_name='Jane Rivera Homes' -v timezone=America/New_York
        -v password="$$SEED_AGENT_PASSWORD" -f /db/seed/agent.sql
        && psql -X -q -v ON_ERROR_STOP=1
        -v email=client@example.com -v name='Alex Chen' -v phone='555-010-0100'
        -v password="$$SEED_CLIENT_PASSWORD" -f /db/seed/client.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgrest:
    image: postgrest/postgrest:v14.18
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_EXTRA_SEARCH_PATH: ""
      PGRST_DB_PRE_REQUEST: api.pre_request
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      # Empty would allow every origin.
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      # `postgrest --ready` probes the admin server, which must listen on loopback.
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
